name: Mobile · Build Dev

on:
  push:
    # Cualquier rama: lo que decide el destino es el mensaje del commit, no la rama.
    branches: ['**']

# El mismo commit se pushea a main y a dev, y cada push dispara su propia corrida:
# salian dos builds identicos por cambio. Agrupando por SHA, el segundo push
# cancela al primero y queda una sola.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.head_commit.id }}
  cancel-in-progress: true

jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'dev.build')
    runs-on: ubuntu-latest
    env:
      CI: 1
      # La URL real del build la fija eas.json (perfil `build`): el bundle se arma en EAS, no acá.
      # Se deja igual para que app.config.js resuelva lo mismo si algo se evalúa localmente.
      EXPO_PUBLIC_API_BASE_URL: https://api.appcarpuling.online/api
      EXPO_PUBLIC_SENTRY_DSN: https://c95e3ddc1f3cedda5dfd938443b504c5@o4511792921837568.ingest.us.sentry.io/4511792924393472
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Build Dev (Android APK + iOS IPA)
        # --platform all: antes solo compilaba android. iOS sale como IPA ad-hoc
        # (distribution: internal en eas.json), o sea que instala unicamente en
        # dispositivos con el UDID registrado: `eas device:create`.
        run: eas build --profile build --platform all --non-interactive
