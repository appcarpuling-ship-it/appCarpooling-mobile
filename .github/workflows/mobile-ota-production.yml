name: Mobile · OTA Production

on:
  push:
    branches: [main]

jobs:
  ota:
    if: contains(github.event.head_commit.message, 'prod.ota:')
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Extraer mensaje del OTA
        id: msg
        run: |
          FULL="${{ github.event.head_commit.message }}"
          MSG="${FULL#prod.ota:}"
          echo "value=$MSG" >> $GITHUB_OUTPUT

      - name: Publicar OTA → production
        run: eas update --channel production --message "${{ steps.msg.outputs.value }}"
