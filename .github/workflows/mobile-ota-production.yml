name: Mobile · OTA Production

on:
  push:
    branches: [main]

jobs:
  ota:
    if: contains(github.event.head_commit.message, 'prod.ota:')
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_SENTRY_DSN: https://c95e3ddc1f3cedda5dfd938443b504c5@o4511792921837568.ingest.us.sentry.io/4511792924393472
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      # Mismo fix que en dev-ota.yml: el mensaje va por env y no interpolado en el
      # script, y solo la primera linea (GITHUB_OUTPUT no admite multilinea asi).
      - name: Extraer mensaje del OTA
        id: msg
        env:
          FULL: ${{ github.event.head_commit.message }}
        run: |
          MSG="${FULL#prod.ota:}"
          echo "value=${MSG%%$'\n'*}" >> $GITHUB_OUTPUT

      - name: Publicar OTA → production
        env:
          MSG: ${{ steps.msg.outputs.value }}
        run: eas update --channel production --message "$MSG"

      - name: Avisar a los usuarios que la actualización está disponible
        env:
          MSG: ${{ steps.msg.outputs.value }}
          OTA_NOTIFY_SECRET: ${{ secrets.OTA_NOTIFY_SECRET }}
        # EXPO_PUBLIC_API_BASE_URL ya está en el env del job (línea de arriba)
        # Se imprime el codigo HTTP: este curl venia fallando con 403 desde siempre
        # —faltaba OTA_NOTIFY_SECRET en el server— y como el paso terminaba en verde
        # igual, la corrida se veia bien y el aviso no llegaba nunca a nadie.
        run: |
          CODIGO=$(curl -sS -o /tmp/ota-notify.txt -w '%{http_code}' -X POST "$EXPO_PUBLIC_API_BASE_URL/notifications/ota-complete" \
            -H "Content-Type: application/json" \
            -H "x-ota-notify-secret: $OTA_NOTIFY_SECRET" \
            -d "$(node -e 'console.log(JSON.stringify({message: process.env.MSG}))')")
          echo "HTTP $CODIGO"; cat /tmp/ota-notify.txt; echo
          # No corta la corrida: el OTA ya se publico, que es lo que importa. Pero se ve.
          [ "$CODIGO" = "200" ] || echo "::warning::El aviso push fallo (HTTP $CODIGO). El OTA se publico igual."
