name: Mobile · OTA Development

on:
  push:
    # Cualquier rama: lo que decide el destino es el mensaje del commit, no la rama.
    branches: ['**']

# El mismo commit se pushea a main y a dev, y cada push dispara su propia corrida:
# salian dos builds identicos por cambio. Agrupando por SHA, el segundo push
# cancela al primero y queda una sola.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.head_commit.id }}
  cancel-in-progress: true

jobs:
  ota:
    if: contains(github.event.head_commit.message, 'dev.ota:')
    runs-on: ubuntu-latest
    env:
      CI: 1
      # `eas update` bundlea acá en el runner, así que esta var sí se inlinea en el JS.
      # Literal y no secret: el secret es compartido con los workflows de producción y apunta a prod.
      EXPO_PUBLIC_API_BASE_URL: https://api.appcarpuling.online/api
      EXPO_PUBLIC_API_BASE_URL_WEB: https://api.appcarpuling.online/api
      EXPO_PUBLIC_SENTRY_DSN: https://c95e3ddc1f3cedda5dfd938443b504c5@o4511792921837568.ingest.us.sentry.io/4511792924393472
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      # El mensaje va por env, NO interpolado en el script: `${{ }}` lo pega como texto
      # dentro del bash, asi que backticks o parentesis en el commit lo rompian
      # (o peor, se ejecutaban). Y solo se toma la primera linea porque GITHUB_OUTPUT
      # es key=value de una sola linea y un commit con cuerpo lo partia.
      - name: Extraer mensaje del OTA
        id: msg
        env:
          FULL: ${{ github.event.head_commit.message }}
        run: |
          MSG="${FULL#dev.ota:}"
          echo "value=${MSG%%$'\n'*}" >> $GITHUB_OUTPUT

      # Los dos canales de dev: `development` lo escucha el dev client (perfil development)
      # y `build` los APK de dev.build.apk (perfil build). Publicar solo a development
      # dejaba a los APK sin recibir nunca un OTA.
      - name: Publicar OTA → development y build
        env:
          MSG: ${{ steps.msg.outputs.value }}
        run: |
          eas update --channel development --message "$MSG" --non-interactive
          eas update --channel build --message "$MSG" --non-interactive

      - name: Avisar a los usuarios que la actualización está disponible
        env:
          MSG: ${{ steps.msg.outputs.value }}
          OTA_NOTIFY_SECRET: ${{ secrets.OTA_NOTIFY_SECRET }}
        # EXPO_PUBLIC_API_BASE_URL ya está en el env del job (literal, apunta al dev server).
        run: |
          curl -sS -X POST "$EXPO_PUBLIC_API_BASE_URL/notifications/ota-complete" \
            -H "Content-Type: application/json" \
            -H "x-ota-notify-secret: $OTA_NOTIFY_SECRET" \
            -d "$(node -e 'console.log(JSON.stringify({message: process.env.MSG}))')"
