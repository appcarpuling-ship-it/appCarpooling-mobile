name: Mobile · OTA Development

on:
  push:
    branches: [dev]

jobs:
  ota:
    if: contains(github.event.head_commit.message, 'dev.ota:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Extraer mensaje del OTA
        id: msg
        run: |
          FULL="${{ github.event.head_commit.message }}"
          MSG="${FULL#dev.ota:}"
          echo "value=$MSG" >> $GITHUB_OUTPUT

      - name: Publicar OTA → development
        run: eas update --channel development --message "${{ steps.msg.outputs.value }}" --non-interactive
