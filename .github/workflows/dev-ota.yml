name: Mobile · OTA Development

on:
  push:
    # Cualquier rama: lo que decide el destino es el mensaje del commit, no la rama.
    branches: ['**']

jobs:
  ota:
    if: contains(github.event.head_commit.message, 'dev.ota:')
    runs-on: ubuntu-latest
    env:
      CI: 1
      # `eas update` bundlea acá en el runner, así que esta var sí se inlinea en el JS.
      # Literal y no secret: el secret es compartido con los workflows de producción y apunta a prod.
      EXPO_PUBLIC_API_BASE_URL: https://api.appcarpuling.online/api
      EXPO_PUBLIC_API_BASE_URL_WEB: https://api.appcarpuling.online/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Extraer mensaje del OTA
        id: msg
        run: |
          FULL="${{ github.event.head_commit.message }}"
          MSG="${FULL#dev.ota:}"
          echo "value=$MSG" >> $GITHUB_OUTPUT

      # Los dos canales de dev: `development` lo escucha el dev client (perfil development)
      # y `build` los APK de dev.build.apk (perfil build). Publicar solo a development
      # dejaba a los APK sin recibir nunca un OTA.
      - name: Publicar OTA → development y build
        run: |
          eas update --channel development --message "${{ steps.msg.outputs.value }}" --non-interactive
          eas update --channel build --message "${{ steps.msg.outputs.value }}" --non-interactive
