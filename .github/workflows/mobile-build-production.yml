name: Mobile · Build Production

on:
  push:
    branches: [main]

jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'prod.build') && !contains(github.event.head_commit.message, 'prod.build.apk')
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_SENTRY_DSN: https://c95e3ddc1f3cedda5dfd938443b504c5@o4511792921837568.ingest.us.sentry.io/4511792924393472
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci


      - name: Build Android (AAB) + iOS (IPA)
        run: eas build --profile production --platform all

