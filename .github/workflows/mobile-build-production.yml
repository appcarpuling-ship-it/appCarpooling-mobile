name: Mobile · Build Production

on:
  push:
    branches: [main]

jobs:
  build:
    if: toJson(github.event.head_commit.modified) == '[]' && toJson(github.event.head_commit.added) == '[]' && contains(github.event.head_commit.message, 'prod.build')
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci


      - name: Build Android (AAB) + iOS (IPA)
        run: eas build --profile production --platform all

